name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  contract-tests:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run contract tests
        run: cargo test --target x86_64-unknown-linux-gnu --package supply-hub-contract

      - name: Build WASM
        env:
          RUSTFLAGS: '-C target-feature=-reference-types -C target-cpu=mvp'
        run: cargo build --target wasm32v1-none --release --package supply-hub-contract

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/supply_hub_contract.wasm

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Vitest (3+ tests)
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_CONTRACT_ID: CALNBNJF7HWOU2T4H33JSOWOZX57NPAHEVENJKDFEWE7363PKF62HCAI
          VITE_EXAMPLE_TX_HASH: placeholder_tx_hash_for_ci_build_only

  integration-check:
    name: Contract ↔ Frontend Function Matching
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify contract function mapping
        run: node scripts/verify-integration.mjs

  deploy-testnet:
    name: Automated Testnet Deployment
    runs-on: ubuntu-latest
    needs: [contract-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/

      - name: Deploy to Stellar Testnet (automated)
        run: node scripts/deploy-contract.mjs

      - name: Upload deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: deployment.json

  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint
        continue-on-error: true

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build production artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Public contract addresses, not secrets. One or more of these were
          # marked "Sensitive" in the Vercel dashboard at some point, which made
          # `vercel pull` write the literal placeholder string "[SENSITIVE]"
          # instead of the real value -- new URL("[SENSITIVE]") then threw at
          # module load, before React ever rendered (blank page, no console
          # error boundary could catch it). Setting them explicitly here
          # overrides that placeholder (Vite gives already-set process.env
          # vars precedence over .env file values).
          VITE_NETWORK: TESTNET
          VITE_CONTRACT_ID: CBEPQQWNA4OU3JEAGXOBSCQNHIXPJPV2ZIXYJTQJOBTTD5AQSMFX5CDT
          VITE_EXAMPLE_TX_HASH: bc25446015cbd314d8c3adfdab751f15782676542bbf8a62385116d778ce3d89
          VITE_RPC_URL: https://soroban-testnet.stellar.org
          VITE_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_TOKEN_ADDRESS: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          # Formspree form endpoints are meant to be public in client-side code
          # (Formspree's own spam/domain protection is what guards them, not
          # secrecy) -- same "[SENSITIVE]" placeholder issue applied here too.
          VITE_FEEDBACK_FORM_ENDPOINT: https://formspree.io/f/mbdnbllr

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
