<title>Nova Supply Hub</title>
<style>
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  :root {
    --bg: #060912;
    --panel: #0b1220;
    --panel-2: rgba(255, 255, 255, 0.035);
    --ink: #f1f5f9;
    --ink-dim: #94a3b8;
    --ink-faint: #5b6779;
    --mint: #5eead4;
    --indigo: #818cf8;
    --sky: #38bdf8;
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.05);
    --font-display: -apple-system, "Segoe UI", ui-sans-serif, Arial, sans-serif;
    --font-body: -apple-system, "Segoe UI", ui-sans-serif, Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    height: 100%;
    width: 100%;
  }

  #stage {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  #deck {
    position: relative;
    z-index: 1;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.5rem, 5vw, 5.5rem) clamp(1.5rem, 6vw, 7rem);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }

  .slide.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mint);
    margin: 0 0 1.1rem;
  }

  .eyebrow.tone-indigo { color: var(--indigo); }
  .eyebrow.tone-sky { color: var(--sky); }

  h1, h2 {
    font-family: var(--font-display);
    text-wrap: balance;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .slide h2 {
    font-size: clamp(1.7rem, 3.6vw, 3rem);
    font-weight: 700;
    line-height: 1.12;
    max-width: 18ch;
  }

  .slide-body {
    max-width: 62ch;
    margin-top: 1.4rem;
    font-size: clamp(0.95rem, 1.15vw, 1.08rem);
    line-height: 1.65;
    color: var(--ink-dim);
  }

  .slide-body p { margin: 0 0 0.9rem; }
  .slide-body p:last-child { margin-bottom: 0; }
  .slide-body strong { color: var(--ink); font-weight: 600; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: clamp(2rem, 4vw, 4rem);
    align-items: center;
    width: 100%;
    max-width: 1180px;
  }

  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .fact-list {
    list-style: none;
    margin: 1.5rem 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .fact-list li {
    display: flex;
    gap: 0.85rem;
    align-items: baseline;
    font-size: 0.95rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .fact-dot {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--mint);
    margin-top: 0.5em;
  }

  .fact-list strong { color: var(--ink); font-weight: 600; }

  .shot-frame {
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 10px;
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.7);
  }

  .shot-frame img {
    width: 100%;
    display: block;
    border-radius: 8px;
  }

  .shot-caption {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--ink-faint);
    margin-top: 0.6rem;
    letter-spacing: 0.03em;
  }

  /* Architecture diagram */
  .arch {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-top: 1.6rem;
    max-width: 720px;
  }

  .arch-box {
    border: 1px solid var(--line);
    background: var(--panel-2);
    border-radius: 10px;
    padding: 0.8rem 1.1rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }

  .arch-box .name { font-weight: 600; font-size: 0.92rem; color: var(--ink); }
  .arch-box .detail { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint); text-align: right; }
  .arch-box.tone-mint { border-color: rgba(94, 234, 212, 0.3); }
  .arch-box.tone-indigo { border-color: rgba(129, 140, 248, 0.3); }
  .arch-box.tone-sky { border-color: rgba(56, 189, 248, 0.3); }

  .arch-link {
    align-self: center;
    width: 1px;
    height: 22px;
    background: linear-gradient(var(--line), transparent);
    position: relative;
  }

  .arch-link::after {
    content: "↓";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--ink-faint);
    font-size: 0.8rem;
    background: var(--bg);
    padding: 0 4px;
  }

  /* Timeline (roadmap) */
  .timeline {
    margin-top: 1.6rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    max-width: 640px;
  }

  .tl-row {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 1.1rem;
    align-items: start;
  }

  .tl-when {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--sky);
    letter-spacing: 0.04em;
    padding-top: 0.15rem;
  }

  .tl-what strong { display: block; color: var(--ink); font-size: 0.95rem; margin-bottom: 0.2rem; }
  .tl-what span { color: var(--ink-dim); font-size: 0.85rem; line-height: 1.5; }

  /* Data grid (proof slide) */
  .data-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 1.7rem;
    max-width: 900px;
  }

  @media (max-width: 800px) {
    .data-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  .data-cell {
    background: var(--panel);
    padding: 1.05rem 1.15rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .data-value {
    font-family: var(--font-mono);
    font-size: clamp(1.15rem, 1.8vw, 1.5rem);
    font-weight: 600;
    color: var(--mint);
    font-variant-numeric: tabular-nums;
  }

  .data-label {
    font-size: 0.72rem;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }

  .contract-line {
    margin-top: 1.4rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
    word-break: break-all;
  }

  .contract-line a { color: var(--sky); text-decoration: none; border-bottom: 1px solid rgba(56, 189, 248, 0.35); }
  .contract-line a:hover { border-bottom-color: var(--sky); }

  .quote-source {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    color: var(--ink-faint);
    margin-top: 0.9rem;
  }

  .quote-source a { color: var(--ink-faint); text-decoration: underline; }

  /* Cover slide */
  .cover {
    justify-content: center;
    align-items: flex-start;
  }

  .cover-mark {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 2.2rem;
  }

  .cover-ring {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--mint);
    position: relative;
  }

  .cover-ring::after {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 16px 2px rgba(94, 234, 212, 0.6);
  }

  .cover-mark span {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .cover h1 {
    font-size: clamp(2.6rem, 8vw, 5.6rem);
    font-weight: 800;
    background: linear-gradient(120deg, var(--ink) 0%, var(--mint) 55%, var(--sky) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .cover-sub {
    margin-top: 1.1rem;
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    color: var(--ink-dim);
    max-width: 42ch;
    line-height: 1.5;
  }

  .cover-meta {
    margin-top: 2.6rem;
    display: flex;
    gap: 1.6rem;
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    color: var(--ink-faint);
  }

  .cover-meta b { color: var(--ink-dim); font-weight: 500; }

  /* Close slide */
  .close-links {
    margin-top: 1.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .close-links a {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.15rem 0;
    border-bottom: 1px solid transparent;
    width: fit-content;
  }

  .close-links a:hover,
  .close-links a:focus-visible {
    border-bottom-color: var(--mint);
  }

  .close-links .tag {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }

  /* Chrome: nav + progress */
  #chrome {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  #hud {
    position: absolute;
    bottom: clamp(1rem, 3vw, 1.8rem);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    pointer-events: auto;
  }

  #hud-index {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-faint);
    min-width: 5.2ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  #dots {
    display: flex;
    gap: 0.42rem;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--line);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }

  .dot.active {
    background: var(--mint);
    transform: scale(1.6);
  }

  .dot:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 3px;
  }

  .navbtn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.02);
    color: var(--ink-dim);
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .navbtn:hover { border-color: var(--mint); color: var(--ink); }
  .navbtn:disabled { opacity: 0.3; cursor: default; }

  .navbtn:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 2px;
  }

  #brandmark {
    position: absolute;
    top: clamp(1.1rem, 3vw, 1.8rem);
    right: clamp(1.3rem, 4vw, 2.2rem);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
</style>

<main id="deck" role="region" aria-label="Pitch deck slides"></main>

<div id="chrome">
  <div id="brandmark">NOVA SUPPLY HUB · ORBIT DECK</div>
  <div id="hud">

    <div id="dots" role="tablist" aria-label="Slide navigation"></div>
    <span id="hud-index"></span>
    <button class="navbtn" id="nextBtn" aria-label="Next slide">›</button>
  </div>
</div>

            '<div class="data-cell"><span class="data-value">22</span><span class="data-label">Shipments recorded on-chain</span></div>' +
            '<div class="data-cell"><span class="data-value">14.6 XLM</span><span class="data-label">Settled through the treasury</span></div>' +
            '<div class="data-cell"><span class="data-value">10&rarr;50</span><span class="data-label">Real wallets verified, growing</span></div>' +
            '<div class="data-cell"><span class="data-value">19 / 19</span><span class="data-label">Automated tests passing</span></div>' +
            '<div class="data-cell"><span class="data-value">28</span><span class="data-label">Meaningful commits, public history</span></div>' +
            '<div class="data-cell"><span class="data-value">100%</span><span class="data-label">CI green, auto-deployed</span></div>' +
          "</div>" +
          '<div class="contract-line">Contract: <a href="https://stellar.expert/explorer/testnet/contract/CBEPQQWNA4OU3JEAGXOBSCQNHIXPJPV2ZIXYJTQJOBTTD5AQSMFX5CDT" target="_blank" rel="noreferrer">CBEPQQWNA4OU3JEAGXOBSCQNHIXPJPV2ZIXYJTQJOBTTD5AQSMFX5CDT &#8599;</a></div>'
        );
      },
    },
    {
      key: "close",
      render: function () {
        return (
          '<div class="eyebrow tone-sky">08 &mdash; Let&rsquo;s talk</div>' +
          "<h2>Nova Supply Hub is live, tested, and growing.</h2>" +
          '<p class="slide-body">Not a mockup &mdash; a running contract on Stellar testnet, with real users, real transactions, and a clear path to mainnet.</p>' +
          '<div class="close-links">' +
            '<a href="https://nova-supply-hub.vercel.app" target="_blank" rel="noreferrer"><span class="tag">LIVE&nbsp;DEMO</span> nova-supply-hub.vercel.app</a>' +
            '<a href="https://github.com/Khanh-09/nova-supply-hub" target="_blank" rel="noreferrer"><span class="tag">REPO</span> github.com/Khanh-09/nova-supply-hub</a>' +
            '<a href="https://stellar.expert/explorer/testnet/contract/CBEPQQWNA4OU3JEAGXOBSCQNHIXPJPV2ZIXYJTQJOBTTD5AQSMFX5CDT" target="_blank" rel="noreferrer"><span class="tag">CONTRACT</span> Stellar Expert &#8599;</a>' +

  ];

  var deck = document.getElementById("deck");
  var dotsWrap = document.getElementById("dots");
  var hudIndex = document.getElementById("hud-index");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var current = 0;

  SLIDES.forEach(function (s, i) {
    var el = document.createElement("section");
    el.className = "slide" + (s.key === "cover" ? " cover" : "");
    el.id = "slide-" + i;
    el.setAttribute("role", "tabpanel");
    el.innerHTML = s.render();
    deck.appendChild(el);

    var dot = document.createElement("button");
    dot.className = "dot";
    dot.setAttribute("role", "tab");
    dot.setAttribute("aria-label", "Go to slide " + (i + 1));
    dot.addEventListener("click", function () { goTo(i); });
    dotsWrap.appendChild(dot);
  });

  var slideEls = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var dotEls = Array.prototype.slice.call(document.querySelectorAll(".dot"));

  function goTo(i) {
    current = Math.max(0, Math.min(SLIDES.length - 1, i));
    slideEls.forEach(function (el, idx) { el.classList.toggle("active", idx === current); });
    dotEls.forEach(function (d, idx) { d.classList.toggle("active", idx === current); });
    hudIndex.textContent = String(current + 1).padStart(2, "0") + " / " + String(SLIDES.length).padStart(2, "0");
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === SLIDES.length - 1;
  }

  prevBtn.addEventListener("click", function () { goTo(current - 1); });
  nextBtn.addEventListener("click", function () { goTo(current + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); goTo(current + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(current - 1); }
    if (e.key === "Home") { e.preventDefault(); goTo(0); }
    if (e.key === "End") { e.preventDefault(); goTo(SLIDES.length - 1); }
  });

  var touchStartX = null;
  deck.addEventListener("touchstart", function (e) { touchStartX = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener("touchend", function (e) {
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) goTo(current + (dx < 0 ? 1 : -1));
    touchStartX = null;
  }, { passive: true });

  goTo(0);

  /* ---- Background: starfield + slow orbital rings ---- */
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var W, H, DPR;
  var stars = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var count = Math.round((W * H) / 9000);
    stars = [];
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.1 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 1.1,
      });
    }
  }

  window.addEventListener("resize", resize);
  resize();

  var t0 = null;

  function frame(ts) {
    if (t0 === null) t0 = ts;
    var t = (ts - t0) / 1000;

    ctx.clearRect(0, 0, W, H);

    var grad = ctx.createRadialGradient(W * 0.78, H * 0.22, 0, W * 0.78, H * 0.22, Math.max(W, H) * 0.7);
    grad.addColorStop(0, "rgba(94, 234, 212, 0.05)");
    grad.addColorStop(1, "rgba(6, 9, 18, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#f1f5f9";
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = reduceMotion ? 0.7 : 0.55 + 0.45 * Math.sin(t * s.speed + s.phase);
      ctx.globalAlpha = 0.15 + tw * 0.55;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawOrbit(W * 0.8, H * 0.28, 210, 70, reduceMotion ? 0 : t * 0.05, "rgba(94, 234, 212, 0.16)");
    drawOrbit(W * 0.8, H * 0.28, 300, 100, reduceMotion ? 0 : -t * 0.035, "rgba(129, 140, 248, 0.12)");
    drawOrbit(W * 0.12, H * 0.82, 160, 55, reduceMotion ? 0 : t * 0.04, "rgba(56, 189, 248, 0.13)");

    if (!reduceMotion) requestAnimationFrame(frame);
  }

  function drawOrbit(cx, cy, rx, ry, angle, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  requestAnimationFrame(frame);
  if (reduceMotion) frame(0);
})();
</script>
